schema = 1
name = "zcode"
verified = "2026-10-30, live session"
config_path = ".zcode/config.json"
format = "json"
template = "claude-like"

[tools]
shell = "Bash"
edit  = ["Edit", "Write", "MultiEdit"]
read  = ["Read", "Grep", "Glob"]

[events]
session_start = "SessionStart"
pre_tool = "PreToolUse"
post_tool = "PostToolUse"

[capabilities]
ask = false
post_event = true
exit_2_blocks = true
rewrites_input = false
json_answers = true

[payload_in]
tool_name = "tool_name"
"shell.command" = "tool_input.command"
"edit.file_path" = "tool_input.file_path"
"read.file_path" = "tool_input.file_path"
cwd = "cwd"
session_id = "session_id"

[payload_out]
