# Claude Code: the canonical protocol itself, so every translation is identity.
# `verified` rests on the nixos-configs hooks (.agents/hooks/*.sh) running under
# Claude Code with these exact field names; it is not a fresh live capture.
schema = 1
name = "claude"
verified = "2026-10-30, nixos-configs .agents/hooks read snake_case payloads under Claude Code"
config_path = ".claude/settings.json"
format = "json"
template = "claude-like"
context_file = "CLAUDE.md"
skills_dir = ".claude/skills"

[tools]
shell = "Bash"
edit = ["Edit", "Write", "MultiEdit"]
read = ["Read", "Grep", "Glob"]

[events]
session_start = "SessionStart"
pre_tool = "PreToolUse"
post_tool = "PostToolUse"

[capabilities]
ask = true
post_event = true
exit_2_blocks = true
rewrites_input = true
json_answers = true

[payload_in]
tool_name = "tool_name"
"shell.command" = "tool_input.command"
"edit.file_path" = "tool_input.file_path"
cwd = "cwd"
session_id = "session_id"

[payload_out]
# No entries: the adapter passes the canonical answer through unchanged
# (this harness speaks the Claude hook protocol).
