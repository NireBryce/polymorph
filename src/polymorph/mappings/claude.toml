# Claude Code: the canonical protocol itself, so every translation is identity.
# No `verified` field: block semantics have not been seen in a live session, which
# `verified` requires (AGENTS.md). What this mapping rests on (2026-10-30): the
# nixos-configs hooks (.agents/hooks/*.sh) running under Claude Code with these exact
# field names, plus a live capture of SessionStart/PreToolUse/PostToolUse payloads via
# t3code (Claude Agent SDK).
schema = 1
name = "claude"
config_path = ".claude/settings.json"
format = "json"
delivery = "direct"   # speaks the canonical protocol: hooks run bare, no adapter
template = "claude-settings"
context_file = "CLAUDE.md"
skills_dir = ".claude/skills"

[tools]
shell = "Bash"
edit = ["Edit", "Write", "MultiEdit"]
read = ["Read", "Grep", "Glob"]

[events]
session_start = "SessionStart"
pre_tool = "PreToolUse"
post_tool = "PostToolUse"

[capabilities]
ask = true
post_event = true
exit_2_blocks = true
rewrites_input = true
json_answers = true

[payload_in]
tool_name = "tool_name"
"shell.command" = "tool_input.command"
"edit.file_path" = "tool_input.file_path"
"read.file_path" = "tool_input.file_path"
"read.path" = "tool_input.path"
"read.pattern" = "tool_input.pattern"
"read.glob" = "tool_input.glob"
cwd = "cwd"
session_id = "session_id"

[payload_out]
# No entries: the adapter passes the canonical answer through unchanged
# (this harness speaks the Claude hook protocol).
