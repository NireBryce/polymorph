name: Bug report
description: polymorph writes a wrong config, translates a hook payload wrongly, or a check gives a wrong finding.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        polymorph is experimental and unvetted. Redact home directories, usernames, repo names and tokens before posting; do not attach a `--full` discovery log.
  - type: input
    id: version
    attributes:
      label: polymorph version or commit
      description: The commit hash (`git rev-parse HEAD`) or the release you installed, and the Python version.
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: Harness and version
      description: Which mapping is involved (for example `zcode`), and the harness version.
  - type: dropdown
    id: rung
    attributes:
      label: How far did you see it?
      description: 'The repo''s rungs, from weakest to strongest evidence: unit tests, a polymorph command whose output you read, a live harness session. "Docs are wrong" covers a report where nothing was run.'
      options:
        - unit test or fixture replay
        - ran a polymorph command and read the output
        - saw it in a live harness session
        - docs are wrong (nothing was run)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened vs what was expected
      description: Actual behavior, expected behavior, and the exact command that shows it.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command output
      description: The full output of the command that shows it, plus a minimal `.agents/settings.json` and mapping that reproduce it. Redact anything secret-shaped.
      render: shell
  - type: textarea
    id: risk-impact
    attributes:
      label: Risk and impact (optional)
      description: "How risky the fix looks and how much it matters, each out of 10 with one line of reason, on the scale in wiki/risk-and-impact.md. Leave it empty if unsure: a maintainer fills it in."
      value: |
        - **Risk: N/10** --
        - **Impact: N/10** --
